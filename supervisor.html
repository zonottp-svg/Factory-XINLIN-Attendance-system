<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ទំព័រប្រធានក្រុម - ថតរូបចុះវត្តមាន</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <!-- ផ្ទាំង Login ប្រធានក្រុម -->
  <div id="supLogin" class="bg-white p-7 rounded-3xl shadow-xl w-full max-w-sm text-center border border-gray-100">
    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">👷</div>
    <h1 class="text-xl font-bold text-gray-900 mb-1">ប្រធានក្រុម (Line Leader)</h1>
    <p class="text-xs text-gray-500 mb-5">ថតរូបចុះវត្តមានសម្រាប់កម្មករអត់មានទូរស័ព្ទ</p>
    <input type="text" id="supPassInput" style="-webkit-text-security: disc;" placeholder="វាយលេខកូដប្រធានក្រុម..." class="w-full px-4 py-3 border rounded-xl mb-4 text-center font-bold outline-none focus:ring-2 focus:ring-amber-500">
    <button onclick="loginSupervisor()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow transition">ចូលប្រើប្រាស់</button>
  </div>

  <!-- ផ្ទាំងថតរូបចុះវត្តមាន -->
  <div id="supApp" class="hidden bg-white p-5 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
    <div class="flex justify-between items-center mb-4 pb-3 border-b">
      <div>
        <h1 class="text-lg font-extrabold text-gray-900">👷 ថតរូបចុះវត្តមានកម្មករ</h1>
        <p class="text-[11px] text-gray-500">សម្រាប់កម្មករអត់ទូរស័ព្ទ (ត្រូវថតរូបមុខផ្ទាល់)</p>
      </div>
      <button onclick="logoutSup()" class="text-xs bg-rose-50 text-rose-600 font-bold px-3 py-1.5 rounded-lg">ចេញ</button>
    </div>

    <!-- ជ្រើសរើស ចូល ឬ ចេញ -->
    <div class="flex gap-3 mb-4">
      <label class="flex-1 text-center py-2.5 border-2 border-green-500 rounded-xl cursor-pointer has-[:checked]:bg-green-500 has-[:checked]:text-white font-bold text-green-700 text-sm transition">
        <input type="radio" name="supScanType" value="IN" checked class="hidden"> ស្កេនចូល (IN)
      </label>
      <label class="flex-1 text-center py-2.5 border-2 border-amber-500 rounded-xl cursor-pointer has-[:checked]:bg-amber-500 has-[:checked]:text-white font-bold text-amber-700 text-sm transition">
        <input type="radio" name="supScanType" value="OUT" class="hidden"> ស្កេនចេញ (OUT)
      </label>
    </div>

    <!-- ស្វែងរក និងជ្រើសរើសកម្មករ -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-gray-600 mb-1">១. ស្វែងរក ឬជ្រើសរើសកម្មករ</label>
      <input type="text" id="workerSearchInput" oninput="filterWorkerList()" placeholder="🔍 វាយអត្តលេខ ឬ ឈ្មោះកម្មករ..." class="w-full px-3 py-2.5 border rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-indigo-500 mb-2">
      <div id="workerDropdown" class="max-h-36 overflow-y-auto border rounded-xl divide-y text-xs bg-slate-50"></div>
      <div id="selectedWorkerBox" class="hidden mt-2 p-2.5 bg-indigo-50 border border-indigo-200 rounded-xl flex justify-between items-center">
        <span id="selectedWorkerLabel" class="font-bold text-indigo-800 text-xs"></span>
        <button onclick="clearSelected()" class="text-xs text-rose-600 font-bold">ដូរម្នាក់ទៀត</button>
      </div>
    </div>

    <!-- កាមេរ៉ាថតរូបមុខកម្មករផ្ទាល់ -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-gray-600 mb-1">២. ថតរូបកម្មករផ្ទាល់នៅកន្លែងធ្វើការ</label>
      <button id="btnOpenCam" onclick="openRearCamera()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
        📸 បើកកាមេរ៉ាថតរូបកម្មករ
      </button>

      <div id="camContainer" class="hidden mt-2">
        <div class="relative rounded-2xl overflow-hidden border-2 border-indigo-500 bg-black">
          <video id="camVideo" autoplay playsinline muted class="w-full h-64 object-cover"></video>
        </div>
        <button id="btnSnapSubmit" onclick="snapAndSubmit()" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base">
          ✅ ថតរូប & រក្សាទុកវត្តមាន
        </button>
      </div>
    </div>

    <canvas id="snapCanvas" class="hidden"></canvas>
    <div id="supResult" class="hidden mt-3 p-3.5 rounded-xl text-center text-xs font-bold"></div>
  </div>

  <script>
    // ⚠️ ដាក់ Web App URL របស់អ្នកត្រង់នេះ ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSi2SLRiX0cx077rWHqq1Rptqe1WH4VqVIpXxEDxnSTtNraCbbKN0IhFHnHeel2LA/exec";

    let supPass = sessionStorage.getItem("factory_sup_pass") || "";
    let workerList = [];
    let selectedWorkerId = "";
    let camStream = null;

    if (supPass) loadSupApp();

    function loginSupervisor() {
      const p = document.getElementById("supPassInput").value.trim();
      if (!p) return alert("សូមវាយលេខកូដ!");
      supPass = p;
      loadSupApp();
    }

    function logoutSup() {
      sessionStorage.removeItem("factory_sup_pass");
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      location.reload();
    }

    function loadSupApp() {
      fetch(SCRIPT_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "SUPERVISOR_GET_WORKERS", supPass: supPass })
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success) {
          alert(data.message);
          sessionStorage.removeItem("factory_sup_pass");
          return;
        }
        sessionStorage.setItem("factory_sup_pass", supPass);
        workerList = data.workers;
        document.getElementById("supLogin").classList.add("hidden");
        document.getElementById("supApp").classList.remove("hidden");
        filterWorkerList();
      })
      .catch(err => alert("បញ្ហាភ្ជាប់ប្រព័ន្ធ: " + err.message));
    }

    function filterWorkerList() {
      const q = document.getElementById("workerSearchInput").value.toLowerCase();
      const filtered = workerList.filter(w => w.id.toLowerCase().includes(q) || w.name.toLowerCase().includes(q) || w.line.toLowerCase().includes(q));
      const box = document.getElementById("workerDropdown");
      box.innerHTML = filtered.slice(0, 20).map(w => `
        <div onclick="selectWorker('${w.id}', '${w.name}', '${w.line}')" class="p-2.5 hover:bg-indigo-50 cursor-pointer flex justify-between items-center">
          <span><b class="text-indigo-700">${w.id}</b> - ${w.name}</span>
          <span class="text-gray-400 text-[10px]">${w.line}</span>
        </div>
      `).join("") || `<div class="p-3 text-center text-gray-400">រកមិនឃើញឈ្មោះទេ</div>`;
    }

    function selectWorker(id, name, line) {
      selectedWorkerId = id;
      document.getElementById("workerDropdown").classList.add("hidden");
      document.getElementById("workerSearchInput").classList.add("hidden");
      document.getElementById("selectedWorkerLabel").innerText = "✅ កំពុងជ្រើសរើស៖ " + id + " - " + name + " (" + line + ")";
      document.getElementById("selectedWorkerBox").classList.remove("hidden");
    }

    function clearSelected() {
      selectedWorkerId = "";
      document.getElementById("selectedWorkerBox").classList.add("hidden");
      document.getElementById("workerDropdown").classList.remove("hidden");
      document.getElementById("workerSearchInput").classList.remove("hidden");
    }

    function openRearCamera() {
      if (!selectedWorkerId) return alert("សូមជ្រើសរើសឈ្មោះកម្មករជាមុនសិន!");
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          camStream = stream;
          document.getElementById("camVideo").srcObject = stream;
          document.getElementById("btnOpenCam").classList.add("hidden");
          document.getElementById("camContainer").classList.remove("hidden");
        })
        .catch(err => alert("មិនអាចបើកកាមេរ៉ាបានទេ: " + err.message));
    }

    function showSupMsg(msg, ok) {
      const el = document.getElementById("supResult");
      el.classList.remove("hidden", "bg-emerald-100", "text-emerald-800", "bg-rose-100", "text-rose-800");
      el.classList.add(ok ? "bg-emerald-100" : "bg-rose-100", ok ? "text-emerald-800" : "text-rose-800");
      el.innerText = msg;
    }

    function snapAndSubmit() {
      if (!selectedWorkerId) return alert("សូមជ្រើសរើសកម្មករ!");
      const btn = document.getElementById("btnSnapSubmit");
      btn.innerText = "កំពុងផ្ញើរូបថត & កត់ត្រា..."; btn.disabled = true;

      const video = document.getElementById("camVideo");
      const canvas = document.getElementById("snapCanvas");
      const w = 360;
      const h = video.videoHeight ? Math.round(360 * (video.videoHeight / video.videoWidth)) : 360;
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(video, 0, 0, w, h);
      const photoBase64 = canvas.toDataURL("image/jpeg", 0.65);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => sendSupervisorCheckin(photoBase64, pos.coords.latitude, pos.coords.longitude),
          () => sendSupervisorCheckin(photoBase64, null, null),
          { timeout: 6000 }
        );
      } else {
        sendSupervisorCheckin(photoBase64, null, null);
      }
    }

    function sendSupervisorCheckin(photoBase64, lat, lng) {
      const btn = document.getElementById("btnSnapSubmit");
      const scanType = document.querySelector('input[name="supScanType"]:checked').value;

      fetch(SCRIPT_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "SUPERVISOR_CHECKIN", supPass: supPass,
          workerId: selectedWorkerId, scanType: scanType,
          photoBase64: photoBase64, lat: lat, lng: lng
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "✅ ថតរូប & រក្សាទុកវត្តមាន"; btn.disabled = false;
        showSupMsg(data.message, data.success);
        if (data.success) clearSelected(); // រួចរាល់ត្រៀមរើសកម្មករបន្ទាប់ភ្លាម
      })
      .catch(err => {
        btn.innerText = "✅ ថតរូប & រក្សាទុកវត្តមាន"; btn.disabled = false;
        showSupMsg("មានបញ្ហាភ្ជាប់ប្រព័ន្ធ: " + err.message, false);
      });
    }
  </script>
</body>
</html>
